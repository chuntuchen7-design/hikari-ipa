name: Build Hikari IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "upstream branch or tag"
        required: false
        default: "main"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: 15dd/hikari_novel_flutter
          ref: ${{ github.event.inputs.ref || 'main' }}
          path: app

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Diagnostics
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Patch sources
        working-directory: app
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          # 1) device_info_plus 13.3.0 调用了 SDK 里不存在的 isiOSAppOnVision，钉回 13.2.0
          pp = pathlib.Path("pubspec.yaml")
          t = pp.read_text(encoding="utf-8")
          if "device_info_plus: ^13.2.0" in t:
              pp.write_text(t.replace("device_info_plus: ^13.2.0", "device_info_plus: 13.2.0"), encoding="utf-8")
              print("pinned device_info_plus -> 13.2.0")
          else:
              print("device_info_plus constraint untouched")

          # 2) 补全请求头，否则 Cloudflare 403
          p = pathlib.Path("lib/common/constants.dart")
          s = p.read_text(encoding="utf-8")
          if "Accept-Language" in s:
              print("UA already patched")
          else:
              new = 'const Map<String, String> kUserAgent = {\n  "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1",\n  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",\n  "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",\n  "Upgrade-Insecure-Requests": "1",\n};'
              pat = re.compile(r"const Map<String, String> kUserAgent = \{.*?\};", re.S)
              if not pat.search(s):
                  raise SystemExit("kUserAgent block not found")
              p.write_text(pat.sub(new, s, count=1), encoding="utf-8")
              print("UA patch applied")
          PYEOF

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build iOS (no codesign)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf Payload hikari.ipa
          mkdir -p Payload
          cp -r app/build/ios/iphoneos/Runner.app Payload/
          zip -qry hikari.ipa Payload
          ls -lh hikari.ipa
          unzip -l hikari.ipa | head -12

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hikari-ipa
          path: hikari.ipa
          retention-days: 30
